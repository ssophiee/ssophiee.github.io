<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="600" height="450" fill="#f0f1f4" rx="12"/>

  <text x="300" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Token Position vs Entropy Trace</text>

  <!-- Y axis -->
  <line x1="80" y1="70" x2="80" y2="370" stroke="#999" stroke-width="1.5"/>
  <text x="28" y="220" text-anchor="middle" font-size="14" fill="#5f6368" transform="rotate(-90,28,220)">Entropy</text>

  <!-- X axis -->
  <line x1="80" y1="370" x2="540" y2="370" stroke="#999" stroke-width="1.5"/>
  <text x="310" y="405" text-anchor="middle" font-size="14" fill="#5f6368">Token Position</text>

  <!-- Grid lines -->
  <line x1="80" y1="130" x2="540" y2="130" stroke="#e0e0e0" stroke-width="0.7"/>
  <line x1="80" y1="190" x2="540" y2="190" stroke="#e0e0e0" stroke-width="0.7"/>
  <line x1="80" y1="250" x2="540" y2="250" stroke="#e0e0e0" stroke-width="0.7"/>
  <line x1="80" y1="310" x2="540" y2="310" stroke="#e0e0e0" stroke-width="0.7"/>

  <!-- Safe Prompt curve (dashed, stays relatively flat) -->
  <path d="M 90,180 C 140,175 180,190 230,200 C 280,210 330,215 380,220 C 430,225 480,230 530,235"
        fill="none" stroke="#5f6368" stroke-width="3" stroke-dasharray="10,6" stroke-linecap="round"/>

  <!-- Harmful Prompt curve (solid, drops steeply) -->
  <path d="M 90,110 C 140,115 180,130 230,170 C 280,210 330,270 380,310 C 430,340 480,355 530,360"
        fill="none" stroke="#d93025" stroke-width="3.5" stroke-linecap="round"/>

  <!-- tau labels -->
  <rect x="430" y="200" width="95" height="26" fill="#f0f1f4" rx="4" opacity="0.9"/>
  <text x="478" y="219" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6368" font-style="italic">&#x3c4; = -0.19</text>

  <rect x="430" y="336" width="95" height="26" fill="#f0f1f4" rx="4" opacity="0.9"/>
  <text x="478" y="355" text-anchor="middle" font-size="14" font-weight="600" fill="#d93025" font-style="italic">&#x3c4; = -0.81</text>

  <!-- Legend -->
  <line x1="150" y1="435" x2="178" y2="435" stroke="#d93025" stroke-width="3.5" stroke-linecap="round"/>
  <text x="184" y="440" font-size="13" fill="#1a1a1a">Harmful Prompt</text>
  <line x1="330" y1="435" x2="358" y2="435" stroke="#5f6368" stroke-width="3" stroke-dasharray="10,6" stroke-linecap="round"/>
  <text x="364" y="440" font-size="13" fill="#1a1a1a">Safe Prompt</text>
</svg>
