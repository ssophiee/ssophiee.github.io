<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="600" height="450" fill="#f0f1f4" rx="12"/>

  <text x="300" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Commit or Abstain?</text>
  <text x="300" y="58" text-anchor="middle" font-size="13" fill="#5f6368">Lower bound must beat all upper bounds</text>

  <!-- Axis -->
  <line x1="60" y1="350" x2="560" y2="350" stroke="#999" stroke-width="1.2"/>

  <!-- Bar group 1: "Paris" — high lower bound, clear winner -->
  <rect x="80" y="110" width="60" height="240" fill="#0b57d0" opacity="0.15" rx="4"/>
  <rect x="92" y="135" width="36" height="215" fill="#0b57d0" opacity="0.75" rx="3"/>
  <line x1="78" y1="110" x2="142" y2="110" stroke="#0b57d0" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="78" y1="170" x2="142" y2="170" stroke="#0b57d0" stroke-width="2"/>
  <text x="110" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Paris</text>

  <!-- Bar group 2: "Lyon" -->
  <rect x="200" y="270" width="60" height="80" fill="#5f6368" opacity="0.12" rx="4"/>
  <rect x="212" y="290" width="36" height="60" fill="#5f6368" opacity="0.55" rx="3"/>
  <line x1="198" y1="270" x2="262" y2="270" stroke="#5f6368" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="198" y1="310" x2="262" y2="310" stroke="#5f6368" stroke-width="2"/>
  <text x="230" y="375" text-anchor="middle" font-size="14" fill="#5f6368">Lyon</text>

  <!-- Bar group 3: "The" -->
  <rect x="320" y="310" width="60" height="40" fill="#5f6368" opacity="0.12" rx="4"/>
  <rect x="332" y="325" width="36" height="25" fill="#5f6368" opacity="0.55" rx="3"/>
  <line x1="318" y1="310" x2="382" y2="310" stroke="#5f6368" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="318" y1="335" x2="382" y2="335" stroke="#5f6368" stroke-width="2"/>
  <text x="350" y="375" text-anchor="middle" font-size="14" fill="#5f6368">The</text>

  <!-- Bar group 4: "It" -->
  <rect x="440" y="320" width="60" height="30" fill="#5f6368" opacity="0.12" rx="4"/>
  <rect x="452" y="332" width="36" height="18" fill="#5f6368" opacity="0.55" rx="3"/>
  <line x1="438" y1="320" x2="502" y2="320" stroke="#5f6368" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="438" y1="340" x2="502" y2="340" stroke="#5f6368" stroke-width="2"/>
  <text x="470" y="375" text-anchor="middle" font-size="14" fill="#5f6368">It</text>

  <!-- Annotation: Paris lower > Lyon upper => commit -->
  <line x1="145" y1="170" x2="195" y2="170" stroke="#0b57d0" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="195" y1="170" x2="195" y2="270" stroke="#0b57d0" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="195" y1="270" x2="198" y2="270" stroke="#0b57d0" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="172" y="225" text-anchor="middle" font-size="11" fill="#0b57d0" font-weight="500">lower &gt; upper</text>

  <!-- Commit badge -->
  <rect x="65" y="80" width="90" height="24" fill="#0b57d0" rx="12"/>
  <text x="110" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Commit</text>

  <!-- Legend -->
  <line x1="120" y1="430" x2="148" y2="430" stroke="#333" stroke-width="2"/>
  <text x="154" y="434" font-size="12" fill="#1a1a1a">lower bound</text>
  <line x1="280" y1="430" x2="308" y2="430" stroke="#333" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="314" y="434" font-size="12" fill="#1a1a1a">upper bound</text>
  <rect x="440" y="422" width="16" height="16" fill="#0b57d0" opacity="0.15" rx="2" stroke="#0b57d0" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="462" y="434" font-size="12" fill="#1a1a1a">credal set</text>
</svg>
