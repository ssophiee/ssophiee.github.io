<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="600" height="450" fill="#f0f1f4" rx="12"/>

  <text x="300" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Same Tweets, Different Designs</text>

  <!-- Y axis -->
  <line x1="80" y1="70" x2="80" y2="360" stroke="#999" stroke-width="1.5"/>
  <text x="30" y="220" text-anchor="middle" font-size="14" fill="#5f6368" transform="rotate(-90,30,220)">Prevalence (%)</text>

  <!-- Y axis ticks -->
  <text x="72" y="364" text-anchor="end" font-size="12" fill="#888">0</text>
  <line x1="76" y1="360" x2="80" y2="360" stroke="#999" stroke-width="1"/>
  <text x="72" y="306" text-anchor="end" font-size="12" fill="#888">20</text>
  <line x1="76" y1="302" x2="80" y2="302" stroke="#999" stroke-width="1"/>
  <text x="72" y="248" text-anchor="end" font-size="12" fill="#888">40</text>
  <line x1="76" y1="244" x2="80" y2="244" stroke="#999" stroke-width="1"/>
  <text x="72" y="190" text-anchor="end" font-size="12" fill="#888">60</text>
  <line x1="76" y1="186" x2="80" y2="186" stroke="#999" stroke-width="1"/>
  <text x="72" y="132" text-anchor="end" font-size="12" fill="#888">80</text>
  <line x1="76" y1="128" x2="80" y2="128" stroke="#999" stroke-width="1"/>

  <!-- X axis -->
  <line x1="80" y1="360" x2="540" y2="360" stroke="#999" stroke-width="1.5"/>
  <text x="310" y="395" text-anchor="middle" font-size="14" fill="#5f6368">Task Design Variant</text>

  <!-- Grid lines -->
  <line x1="80" y1="302" x2="540" y2="302" stroke="#e0e0e0" stroke-width="0.7"/>
  <line x1="80" y1="244" x2="540" y2="244" stroke="#e0e0e0" stroke-width="0.7"/>
  <line x1="80" y1="186" x2="540" y2="186" stroke="#e0e0e0" stroke-width="0.7"/>
  <line x1="80" y1="128" x2="540" y2="128" stroke="#e0e0e0" stroke-width="0.7"/>

  <!-- Bars - Offensive Language (varying heights to show design sensitivity) -->
  <!-- D1 --> <rect x="100" y="168" width="28" height="192" fill="#0b57d0" rx="3" opacity="0.85"/>
  <!-- D2 --> <rect x="140" y="215" width="28" height="145" fill="#0b57d0" rx="3" opacity="0.85"/>
  <!-- D3 --> <rect x="180" y="128" width="28" height="232" fill="#0b57d0" rx="3" opacity="0.85"/>
  <!-- D4 --> <rect x="220" y="272" width="28" height="88" fill="#0b57d0" rx="3" opacity="0.85"/>
  <!-- D5 --> <rect x="260" y="198" width="28" height="162" fill="#0b57d0" rx="3" opacity="0.85"/>
  <!-- D6 --> <rect x="300" y="310" width="28" height="50" fill="#0b57d0" rx="3" opacity="0.85"/>

  <!-- Bars - Hate Speech (lower, also varying) -->
  <!-- D1 --> <rect x="100" y="314" width="28" height="46" fill="#d93025" rx="3" opacity="0.75"/>
  <!-- D2 --> <rect x="140" y="331" width="28" height="29" fill="#d93025" rx="3" opacity="0.75"/>
  <!-- D3 --> <rect x="180" y="285" width="28" height="75" fill="#d93025" rx="3" opacity="0.75"/>
  <!-- D4 --> <rect x="220" y="348" width="28" height="12" fill="#d93025" rx="3" opacity="0.75"/>
  <!-- D5 --> <rect x="260" y="302" width="28" height="58" fill="#d93025" rx="3" opacity="0.75"/>
  <!-- D6 --> <rect x="300" y="340" width="28" height="20" fill="#d93025" rx="3" opacity="0.75"/>

  <!-- More designs -->
  <!-- D7 --> <rect x="340" y="190" width="28" height="170" fill="#0b57d0" rx="3" opacity="0.85"/>
              <rect x="340" y="320" width="28" height="40" fill="#d93025" rx="3" opacity="0.75"/>
  <!-- D8 --> <rect x="380" y="250" width="28" height="110" fill="#0b57d0" rx="3" opacity="0.85"/>
              <rect x="380" y="338" width="28" height="22" fill="#d93025" rx="3" opacity="0.75"/>
  <!-- D9 --> <rect x="420" y="155" width="28" height="205" fill="#0b57d0" rx="3" opacity="0.85"/>
              <rect x="420" y="295" width="28" height="65" fill="#d93025" rx="3" opacity="0.75"/>
  <!-- D10 --><rect x="460" y="290" width="28" height="70" fill="#0b57d0" rx="3" opacity="0.85"/>
              <rect x="460" y="350" width="28" height="10" fill="#d93025" rx="3" opacity="0.75"/>
  <!-- D11 --><rect x="500" y="230" width="28" height="130" fill="#0b57d0" rx="3" opacity="0.85"/>
              <rect x="500" y="325" width="28" height="35" fill="#d93025" rx="3" opacity="0.75"/>

  <!-- Legend -->
  <rect x="160" y="416" width="14" height="14" fill="#0b57d0" rx="2" opacity="0.85"/>
  <text x="180" y="428" font-size="13" fill="#1a1a1a">Offensive Language</text>
  <rect x="340" y="416" width="14" height="14" fill="#d93025" rx="2" opacity="0.75"/>
  <text x="360" y="428" font-size="13" fill="#1a1a1a">Hate Speech</text>
